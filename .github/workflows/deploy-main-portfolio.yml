name: Deploy main portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: main_portfolio/package-lock.json

      - name: Install dependencies
        working-directory: main_portfolio
        run: npm ci

      - name: Build portfolio
        working-directory: main_portfolio
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./main_portfolio/dist
          publish_branch: gh-pages
          force_orphan: true
